name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_VERSION: "3.28.0"
  QT_VERSION: "6.9.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows MSVC 2022 x64"
            os: windows-2022
            preset: "windows-msvc-x64-release"
            generator: "Visual Studio 17 2022"
            platform: "x64"
            qt_arch: "win64_msvc2022_64"
            artifact_prefix: "windows-msvc-x64"

          - name: "macOS x86_64 (Intel)"
            os: macos-13
            preset: "macos-x64-release"
            generator: "Ninja"
            build_type: "Release"
            qt_arch: "clang_64"
            artifact_prefix: "macos-x64"

          - name: "Linux x64"
            os: ubuntu-22.04
            preset: "linux-x64-release"
            generator: "Ninja"
            build_type: "Release"
            qt_arch: "linux_gcc_64"
            artifact_prefix: "linux-x64"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependencies
      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake build-essential libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev qt6-base-dev qt6-base-dev-tools
          elif [ "${{ runner.os }}" == "macOS" ]; then
            brew install ninja cmake
          fi
        shell: bash

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja cmake -y

      # Qt setup
      - name: Install Qt (Windows/macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      # 🏗Build
      - name: Configure CMake
        run: |
          cmake -E make_directory build
          cd build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -G "${{ matrix.generator }}" -A ${{ matrix.platform }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_EXAMPLES=ON \
              -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
              ..
          else
            cmake -G "${{ matrix.generator }}" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBUILD_EXAMPLES=ON \
              -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
              ..
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      # Packaging
      - name: Package artifacts
        run: |
          cd build
          case "${{ runner.os }}" in
            Windows)
              cpack -C Release -G NSIS
              ;;
            macOS)
              cpack -C Release -G DragNDrop
              cpack -C Release -G TGZ
              ;;
            Linux)
              cpack -C Release -G DEB
              cpack -C Release -G RPM
              cpack -C Release -G TGZ
              ;;
          esac
        shell: bash

      # Upload packages
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-packages
          path: build/QTradingView-*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
